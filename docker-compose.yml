version: '3.9'

services:
  db:
    image: postgres:18
    container_name: dealdna-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealdna}
      POSTGRES_USER: ${POSTGRES_USER:-dealdna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealdna}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
